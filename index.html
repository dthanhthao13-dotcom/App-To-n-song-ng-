<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Toán Song Ngữ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: thẻ nhãn dán viền đậm trên nền chấm kem, thanh tab nổi dạng viên thuốc, linh vật thú nhỏ. Màu đổi theo vai: giáo viên xanh ngọc điềm tĩnh, học sinh tím vui mắt. */
:root{
  --paper:#fbf6ea;--dot:#e8dcbf;--ink:#2a2147;--muted:#645c80;--card:#ffffff;--line:#e2d8bd;
  --pen:#0c7a68;--on-pen:#ffffff;--hi:#ffd23f;--on-hi:#2a2147;--good:#14803f;--bad:#c13a2c;--soft:#e4f3ee;
  --board:#1f1a3d;--on-board:#fdf9ee;--rad:18px;
  --g1:#d9482b;--g2:#a8620a;--g3:#14803f;--g4:#1f6fc0;--g5:#8a3fc6;
  --f-d:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-i:'Noto Sans','Segoe UI',system-ui,sans-serif;
}
:root[data-role="student"]{--pen:#6b3fd4;--soft:#eee7fc;--paper:#fff6dc;--dot:#f0dfa8;--line:#ead9a6;--rad:22px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171329;--dot:#241f42;--ink:#f4efe0;--muted:#aca5c9;--card:#211c3d;--line:#3a3363;
    --pen:#4fd1b5;--on-pen:#0c1a17;--hi:#ffd23f;--on-hi:#2a2147;--good:#4cd391;--bad:#ff8a7e;--soft:#1d3036;
    --board:#0f0c20;--on-board:#fdf9ee;
    --g1:#ff9070;--g2:#ffbf5a;--g3:#52d1a0;--g4:#7db1ff;--g5:#c29cff;color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-role="student"]{--pen:#b79bff;--on-pen:#1b1236;--soft:#2a2250;--paper:#181230}
}
:root[data-theme="dark"]{
  --paper:#171329;--dot:#241f42;--ink:#f4efe0;--muted:#aca5c9;--card:#211c3d;--line:#3a3363;
  --pen:#4fd1b5;--on-pen:#0c1a17;--hi:#ffd23f;--on-hi:#2a2147;--good:#4cd391;--bad:#ff8a7e;--soft:#1d3036;
  --board:#0f0c20;--on-board:#fdf9ee;
  --g1:#ff9070;--g2:#ffbf5a;--g3:#52d1a0;--g4:#7db1ff;--g5:#c29cff;color-scheme:dark;
}
:root[data-theme="dark"][data-role="student"]{--pen:#b79bff;--on-pen:#1b1236;--soft:#2a2250;--paper:#181230}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-b);font-size:15px;line-height:1.5;color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.8px);
  background-size:22px 22px;min-height:100%}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,6.5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
mark{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);color:inherit;padding:0 .1em}
.bl{display:inline-block;min-width:2.2em;height:.95em;border-bottom:3px solid var(--pen);margin:0 .2em;vertical-align:-.1em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:2px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-align:left}
.logo{width:38px;height:38px;border-radius:50%;background:var(--hi);border:2px solid var(--ink);overflow:hidden;display:inline-flex;align-items:flex-end;justify-content:center;flex:none}
.bn{font-family:var(--f-d);font-weight:700;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn b{color:var(--pen);font-weight:800}
.tools{display:flex;align-items:center;gap:2px}
.pill{height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:.8rem;font-weight:700;white-space:nowrap;margin-right:4px}
@media (max-width:460px){.tools>button:nth-child(2){display:none}.pill{padding:0 10px;margin-right:0}.bn{font-size:1.02rem}}
.pill:hover{border-color:var(--pen)}

.shell{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-size:.86rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.stack{display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);max-width:62ch}
.lead{display:flex;flex-direction:column;gap:6px}

.ctx{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.seg button{min-height:46px;border-radius:10px;font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;color:var(--muted)}
.seg button b{font-size:.95rem;font-family:var(--f-d);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--lc)}
.lvdesc{color:var(--muted);font-size:.84rem}

.card{background:var(--card);border:2px solid var(--line);border-radius:var(--rad);padding:14px 16px;min-width:0;box-shadow:0 3px 0 var(--line)}
.sticker{border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.head h3{overflow-wrap:anywhere}
h3.ph{font-family:var(--f-b);font-size:1.06rem;font-weight:600;line-height:1.4}
h3.term{font-size:1.3rem}
.acts{display:flex;gap:2px;flex:none}
.ipa{font-family:var(--f-i);color:var(--muted);font-size:.9rem}
.vi{font-weight:600;margin-top:2px}
.reading{font-weight:600;margin-top:4px}
.ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.92rem}
.ex span{display:block;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.tag{--gc:var(--muted);font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--gc) 16%,transparent);color:var(--gc)}
.tag.n{--gc:var(--pen)}
.tag.ok{--gc:var(--good)}
.fav.on{color:var(--g2)}
.fav.on svg{fill:currentColor}
.sym{font-family:var(--f-i);font-weight:600;font-size:1.35rem;overflow-wrap:anywhere}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;padding:0 14px 0 44px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.search input:focus{border-color:var(--pen);outline:none}
.count{color:var(--muted);font-size:.85rem}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:hover{border-color:var(--pen)}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--on-pen);box-shadow:0 3px 0 color-mix(in srgb,var(--pen) 55%,#000)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.mini{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.pres .btn,.pres-bot .btn,.tmset .btn{box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns>*{flex:1 1 140px}

/* dashboard */
.me{display:flex;flex-direction:column;gap:12px}
.me-top{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800;font-size:1.4rem;flex:none}
.me-top h1{font-size:1.5rem}
.me-top .sub{font-size:.88rem}
.field{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.field input{height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1rem;color:var(--ink)}
.field input:focus{border-color:var(--pen);outline:none}
.sec-t{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-d);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:1rem;font-weight:600;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--pen);border-radius:99px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-pick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.role-pick button:hover{border-color:var(--pen)}
.role-pick b{font-family:var(--f-d);font-size:1.1rem}
.role-pick span{font-size:.82rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.feat{--c:var(--pen);text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.feat:hover{border-color:var(--c)}
.tile{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.feat h3{font-size:1.05rem}
.feat p{color:var(--muted);font-size:.84rem}
.lvrow{display:flex;gap:10px;align-items:flex-start}
.lvrow .n{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800;background:color-mix(in srgb,var(--lc) 18%,transparent);color:var(--lc)}
.lvrow p{font-size:.88rem;color:var(--muted)}
.lvrow b{display:block;color:var(--ink);font-size:.92rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.facts div{background:var(--soft);border-radius:12px;padding:10px 12px}
.facts b{display:block;font-family:var(--f-d);font-size:1.4rem;font-variant-numeric:tabular-nums}
.facts span{font-size:.78rem;color:var(--muted)}

/* practice */
.flash{min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:24px 16px}
.flash .big{font-family:var(--f-d);font-weight:700;font-size:clamp(1.8rem,8vw,2.6rem);overflow-wrap:anywhere}
.flash .hint{color:var(--muted);font-size:.85rem}
.ctx-sent{font-size:1.3rem;line-height:1.5;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.opt:hover:not([disabled]){border-color:var(--pen)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.opt[disabled]{cursor:default}
.opt.gone{visibility:hidden}
.prompt{text-align:center;padding:22px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.prompt .big{font-family:var(--f-d);font-weight:700;font-size:clamp(1.7rem,7vw,2.4rem);overflow-wrap:anywhere}
.prompt .sym{font-size:clamp(1.7rem,7vw,2.4rem)}
.type-in{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem}
.type-in:focus{border-color:var(--pen);outline:none}
.type-in.right{border-color:var(--good)}
.type-in.wrong{border-color:var(--bad)}
.feedback{font-weight:600}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.stats b{color:var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:0 8px;min-height:44px;font-size:.88rem}
.rate .btn.on{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.shcard{padding:22px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.shcard .big{font-family:var(--f-d);font-weight:700;font-size:clamp(1.5rem,6vw,2.1rem);overflow-wrap:anywhere;line-height:1.25}
.shcard .big.ph{font-family:var(--f-b);font-size:clamp(1.2rem,5vw,1.6rem);font-weight:600}
.gbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.gbar i{display:block;height:100%;width:100%;background:var(--good)}
.gbar.low i{background:var(--bad)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.score{font-family:var(--f-d);font-size:2.4rem;font-weight:800}
.num{font-variant-numeric:tabular-nums}

/* lessons */
.lcard{text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.lcard:hover{border-color:var(--pen)}
.lcard h3{font-size:1.2rem}
.sect{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:4px}
.step-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:800}
.step-h h3{flex:1;min-width:0}
.sublbl{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:4px}
.chipl{display:flex;flex-wrap:wrap;gap:6px}
.vchip{padding:4px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:.88rem}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tab-in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:var(--card);border:2px solid var(--ink);border-radius:26px;box-shadow:0 4px 0 var(--ink)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:20px;color:var(--muted);font-size:.7rem;font-weight:600;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--on-pen);background:var(--pen)}
.scrim{position:fixed;inset:0;background:rgba(10,16,40,.5);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--card);z-index:41;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.drawer h4{margin:14px 10px 4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dl{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 10px;border-radius:12px;font-weight:600;width:100%;text-align:left}
.dl:hover{background:var(--soft)}
.dl[aria-current="page"]{background:var(--soft);color:var(--pen)}
.dl em{margin-left:auto;font-style:normal;font-size:.8rem;color:var(--muted);font-weight:600}
.dfoot{margin-top:auto;padding:12px 10px 0;color:var(--muted);font-size:.78rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:80;max-width:calc(100vw - 32px)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.form input,.form select{height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.form input:focus,.form select:focus{border-color:var(--pen);outline:none}

/* presentation */
.pres{position:fixed;inset:0;z-index:60;background:var(--board);color:var(--on-board);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));gap:10px}
.pres-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pres-top span{font-size:.85rem;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres .icon-btn{color:var(--on-board)}
.pres .icon-btn:hover{background:rgba(255,255,255,.1)}
.pres-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px 4px;touch-action:pan-y;cursor:pointer}
.pres-main .big{font-family:var(--f-d);font-weight:700;font-size:clamp(2rem,8.5vw,3.4rem);line-height:1.2;overflow-wrap:anywhere}
.pres-main .big.ph{font-family:var(--f-b);font-weight:600;font-size:clamp(1.6rem,7vw,2.8rem)}
.pres-main .bi{font-family:var(--f-i);opacity:.75;font-size:1.1rem}
.pres-main .bv{font-size:clamp(1.05rem,4vw,1.5rem);color:var(--hi)}
.pres-main .tapn{font-size:.82rem;opacity:.6}
.pres .bl{border-bottom-color:var(--hi)}
.pres-ctl{display:flex;gap:10px}
.pres-ctl .btn{flex:1;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-board)}
.pres-ctl .btn.pri{flex:2;background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.pres-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pres-bot .btn{min-height:40px;padding:0 12px;font-size:.84rem;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-board)}
.pres-bot .t{font-family:var(--f-d);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;margin-left:auto}
.pres-bot .t.done{color:var(--bad)}
.tmset{display:flex;gap:6px}
.tmset .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-board)}
.tmset .btn[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
/* cấu trúc câu */
.fvh{color:var(--muted);font-size:.84rem;margin-top:4px}

   {t:"Làm riêng bốn phép tính",min:8,lv:3,

         ["Read your answer to your partner.","Đọc đáp án cho bạn nghe.","Read|partner"]],

   {t:"Tổng kết",min:5,lv:2,

  id:"cong-10",g:1,dur:35,
  title:"Phép cộng trong phạm vi 10",sub:"Đếm, gộp lại và đọc phép cộng bằng tiếng Anh",
  math:["Gộp hai nhóm đồ vật và tìm tổng, ví dụ 3 + 2 = 5.","Đọc và viết phép cộng trong phạm vi 10.","Nhận ra thứ tự đổi chỗ: 3 + 2 = 2 + 3."],

   {t:"Đếm đồ vật thật",min:6,lv:1,

         ["There are two pencils in this box.","Trong hộp này có hai cây bút chì.","two pencils"],
         ["How many pencils altogether?","Tất cả có mấy cây bút chì?","altogether"]],
    stu:[["There are ___ pencils altogether.","Có tất cả ___ cây bút chì.","altogether"]]},
   {t:"Học bốn từ mới",min:7,lv:1,
    act:["Viết 3 + 2 = 5 lên bảng, chỉ từng phần khi đọc.","Cả lớp đọc theo hai lần, có động tác: hai tay chập vào nhau khi nói add.","Đọc từ, mời học sinh lên chỉ đúng phần."],
    say:[["We add two groups together.","Ta gộp hai nhóm lại với nhau.","add|together"],

         ["The answer to an addition is called the sum.","Kết quả của phép cộng gọi là tổng.","sum|addition"],

   {t:"Đọc và viết phép cộng",min:12,lv:2,
    act:["Viết 3 + 2 = 5 và đọc to bằng tiếng Anh.","Đổi thành 2 + 3 = 5, hỏi lớp có gì giống nhau.","Phát thẻ số cho từng cặp, các em tự lập phép cộng và đọc cho bạn nghe."],
    say:[["Three plus two equals five.","Ba cộng hai bằng năm.","Three plus two|equals"],
         ["Now read it with your partner.","Bây giờ đọc cho bạn nghe.","read|partner"],
         ["Is two plus three the same?","Hai cộng ba có giống không?","the same"],
         ["Yes, the sum is the same.","Đúng, tổng vẫn như vậy.","sum"]],
    stu:[["___ plus ___ equals ___.","___ cộng ___ bằng ___.","plus|equals"],
         ["The sum is ___.","Tổng là ___.","sum"]],
    probs:[["3 + 2 = 5","Three plus two equals five.","3 cộng 2 bằng 5."],
           ["4 + 1 = 5","Four plus one equals five.","4 cộng 1 bằng 5."],
           ["6 + 3 = 9","Six plus three equals nine.","6 cộng 3 bằng 9."],
           ["5 + 5 = 10","Five plus five equals ten.","5 cộng 5 bằng 10."]]},
   {t:"Trò chơi và tổng kết",min:10,lv:3,

    say:[["Pick two number cards.","Rút hai thẻ số.","Pick|number cards"],

  id:"bang-nhan-2-5",g:2,dur:40,
  title:"Bảng nhân 2 và bảng nhân 5",sub:"Các nhóm bằng nhau và đọc phép nhân",
  math:["Hiểu phép nhân là gộp các nhóm có số lượng bằng nhau, ví dụ 3 nhóm 2 là 3 × 2 = 6.","Thuộc và đọc được bảng nhân 2 và bảng nhân 5.","Nhận ra kết quả của bảng nhân 5 tận cùng là 0 hoặc 5."],
  of:["multiply","times","product","equal groups","group","row","table"],
  forL:["There are ___ groups of ___.","Can you say it again, please?"],
  through:"Từ phát sinh trong tiết (ví dụ: each, every, in total). Ghi ở góc bảng và đọc lại cuối tiết.",
  mats:["30 hạt đậu hoặc que tính","6 cái đĩa giấy","Bảng nhân 2 và 5 cỡ lớn","Thẻ từ: times, product, group, row"],
  steps:[
   {t:"Xếp các nhóm bằng nhau",min:7,lv:1,
    act:["Đặt 2 hạt đậu vào mỗi đĩa, làm 4 đĩa.","Cả lớp đếm số đĩa, rồi đếm số hạt ở một đĩa.","Gộp lại đếm tất cả bằng cách đếm cách 2."],

         ["Each group has two beans.","Mỗi nhóm có hai hạt đậu.","Each|two beans"],
         ["These are equal groups.","Đây là các nhóm bằng nhau.","equal groups"],
         ["How many beans in total?","Tổng cộng có mấy hạt đậu?","in total"]],
    stu:[["There are ___ groups of ___.","Có ___ nhóm, mỗi nhóm ___.","groups"],
         ["There are ___ beans in total.","Có tất cả ___ hạt đậu.","in total"]]},
   {t:"Từ mới: times và product",min:8,lv:1,
    act:["Viết 4 × 2 = 8 lên bảng. Chỉ từng phần khi đọc.","Giải thích: multiply là nhân, times là nhân, product là tích.","Cả lớp đọc theo hai lần."],
    say:[["Four times two equals eight.","Bốn nhân hai bằng tám.","Four times two|equals"],
         ["We multiply to find the product.","Ta nhân để tìm tích.","multiply|product"],
         ["Eight is the product of four and two.","Tám là tích của bốn và hai.","product"],
         ["Repeat after me.","Nhắc lại theo cô/thầy.","Repeat"]],
    stu:[["___ times ___ equals ___.","___ nhân ___ bằng ___.","times|equals"]]},
   {t:"Đọc bảng nhân 2 và 5",min:15,lv:2,
    act:["Treo bảng nhân 2, cả lớp đọc theo từng hàng.","Làm tương tự với bảng nhân 5, hỏi lớp có nhận xét gì về chữ số tận cùng.","Chia cặp: một em hỏi, một em đáp, sau đó đổi vai."],
    say:[["Let's read the table of twos.","Ta đọc bảng nhân 2.","read|table"],
         ["Look at each row. What do you notice?","Nhìn từng hàng. Em nhận thấy gì?","each row|notice"],
         ["The products end in zero or five.","Các tích tận cùng là 0 hoặc 5.","products|zero or five"],
         ["What is five times six?","Năm nhân sáu bằng mấy?","five times six"]],
    stu:[["Five times six equals thirty.","Năm nhân sáu bằng ba mươi.","times"],
         ["The product is ___.","Tích là ___.","product"]],
    probs:[["2 × 3 = 6","Two times three equals six.","2 nhân 3 bằng 6."],
           ["2 × 7 = 14","Two times seven equals fourteen.","2 nhân 7 bằng 14."],
           ["5 × 4 = 20","Five times four equals twenty.","5 nhân 4 bằng 20."],
           ["5 × 9 = 45","Five times nine equals forty-five.","5 nhân 9 bằng 45."]]},
   {t:"Hỏi nhanh đáp gọn và tổng kết",min:10,lv:3,
    act:["Một em ra câu hỏi cho bạn bằng thẻ số.","Cả lớp nói đáp án cùng lúc khi cô/thầy hỏi.","Cuối tiết hỏi một điều đã học."],
    say:[["Ask your partner a question.","Hỏi bạn một câu hỏi.","Ask|partner"],
         ["What is two times eight?","Hai nhân tám bằng mấy?","two times eight"],
         ["Everyone, say the answer together.","Cả lớp cùng nói đáp án.","together"]],
    stu:[["What is ___ times ___?","___ nhân ___ bằng mấy?","times"],
         ["Today I learned that ___.","Hôm nay em học được rằng ___.","learned"]]}

  id:"cac-loai-goc",g:4,dur:45,
  title:"Các loại góc",sub:"Góc nhọn, góc vuông, góc tù, góc bẹt và cách đo bằng thước đo góc",
  math:["Nhận biết và gọi tên góc nhọn (bé hơn 90°), góc vuông (bằng 90°), góc tù (lớn hơn 90°, bé hơn 180°), góc bẹt (bằng 180°).","Dùng thước đo góc để đo một góc.","So sánh các góc bằng cách ước lượng rồi kiểm tra bằng đo."],
  of:["angle","acute angle","right angle","obtuse angle","straight angle","degree","protractor","vertex"],
  forL:["This angle is ___ because ___.","I estimate that the angle is about ___ degrees."],
  through:"Từ phát sinh trong tiết (ví dụ: bigger than, smaller than, measure, line up). Ghi ở góc bảng và đọc lại cuối tiết.",
  mats:["Thước đo góc cho mỗi cặp","Giấy A4 gấp tạo góc vuông","Thẻ hình các góc khác nhau","Thẻ từ: acute, right, obtuse, straight"],
  steps:[
   {t:"Tìm góc trong lớp học",min:6,lv:1,
    act:["Chỉ vào góc bảng, góc cửa, góc cuốn sách.","Giơ hai tay làm hai cạnh của góc, mở rộng dần.","Giới thiệu đỉnh và hai cạnh."],
    say:[["Look at the corner of the book. It is an angle.","Nhìn góc quyển sách. Đó là một góc.","corner|angle"],
         ["An angle has a vertex and two sides.","Góc có một đỉnh và hai cạnh.","vertex|two sides"],
         ["Can you find an angle in our classroom?","Em tìm được góc nào trong lớp học không?","find|classroom"]],
    stu:[["I can see an angle on ___.","Em thấy một góc ở ___.","angle"]]},
   {t:"Bốn loại góc",min:12,lv:1,

    say:[["This is a right angle. It is ninety degrees.","Đây là góc vuông. Nó bằng chín mươi độ.","right angle|ninety degrees"],

         ["An obtuse angle is bigger than a right angle.","Góc tù lớn hơn góc vuông.","obtuse angle|bigger"],
         ["A straight angle is one hundred and eighty degrees.","Góc bẹt bằng một trăm tám mươi độ.","straight angle|degrees"],
         ["Repeat after me.","Nhắc lại theo cô/thầy.","Repeat"]],
    stu:[["This is an ___ angle.","Đây là góc ___.","angle"],
         ["It is smaller than a right angle.","Nó bé hơn góc vuông.","smaller"]],
    probs:[["30°","Thirty degrees.","Ba mươi độ."],
           ["90°","Ninety degrees.","Chín mươi độ."],
           ["120°","One hundred and twenty degrees.","Một trăm hai mươi độ."],
           ["180°","One hundred and eighty degrees.","Một trăm tám mươi độ."]]},
   {t:"Đo góc bằng thước đo góc",min:15,lv:2,
    act:["Làm mẫu: đặt tâm thước vào đỉnh, một cạnh nằm trên vạch 0.","Đọc số đo ở vạch mà cạnh còn lại đi qua.","Các cặp đo ba góc trên phiếu rồi nói kết quả bằng khung câu."],
    say:[["Put the centre of the protractor on the vertex.","Đặt tâm thước đo góc vào đỉnh.","protractor|vertex"],
         ["Line up one side with zero.","Đặt một cạnh trùng vạch 0.","Line up|zero"],
         ["Read the number where the other side crosses.","Đọc số ở chỗ cạnh còn lại đi qua.","Read|crosses"],
         ["How many degrees is this angle?","Góc này bao nhiêu độ?","degrees"]],
    stu:[["The angle is ___ degrees.","Góc này bằng ___ độ.","degrees"],
         ["It is an ___ angle because it is ___ than ninety degrees.","Nó là góc ___ vì nó ___ hơn chín mươi độ.","because"]]},
   {t:"Phân loại và tổng kết",min:12,lv:3,
    act:["Phát 8 thẻ góc, nhóm xếp vào bốn cột: nhọn, vuông, tù, bẹt.","Mỗi nhóm giải thích một thẻ trước lớp.","Cuối tiết hỏi một điều đã học."],
    say:[["Sort the cards into four groups.","Xếp các thẻ vào bốn nhóm.","Sort|four groups"],
         ["Explain why you put this card here.","Giải thích vì sao em đặt thẻ này ở đây.","Explain|why"],
         ["Well done! Who can tell me one thing you learned?","Giỏi lắm! Ai nói được một điều em học được?","learned"]],
    stu:[["I put this card here because it is ___.","Em đặt thẻ này ở đây vì nó ___.","because"],
         ["Today I learned that ___.","Hôm nay em học được rằng ___.","learned"]]}

  id:"phan-tram",g:5,dur:45,
  title:"Phần trăm của một số",sub:"Đọc phần trăm, đổi sang phân số và tính phần trăm của một số",
  math:["Hiểu phần trăm là số phần trong 100 phần bằng nhau, ví dụ 25% = 25/100.","Tính phần trăm của một số, ví dụ 25% của 40 là 10.","Đọc và viết phần trăm, số thập phân bằng tiếng Anh."],
  of:["percent","percentage","ratio","whole","part","decimal"],
  forL:["___ percent of ___ is ___.","I calculated it by ___."],
  through:"Từ phát sinh trong tiết (ví dụ: out of, per hundred, equal parts). Ghi ở góc bảng và đọc lại cuối tiết.",
  mats:["Lưới ô vuông 10 × 10 cho mỗi cặp","Bút màu","Phiếu 4 phép tính ở Bước 3","Thẻ từ: percent, whole, part, decimal"],

   {t:"Tô màu lưới 100 ô",min:8,lv:1,

    say:[["Colour twenty-five squares.","Tô màu hai mươi lăm ô vuông.","Colour|squares"],
         ["There are one hundred squares in the whole grid.","Cả lưới có một trăm ô vuông.","whole|hundred"],
         ["Twenty-five out of one hundred is twenty-five percent.","Hai mươi lăm trên một trăm là hai mươi lăm phần trăm.","out of|percent"]],
    stu:[["___ out of one hundred is ___ percent.","___ trên một trăm là ___ phần trăm.","percent"]]},
   {t:"Từ mới và cách đọc",min:8,lv:1,
    act:["Viết 25%, 0,25 và 25/100 cạnh nhau, chỉ ra chúng bằng nhau.","Đọc từng cách đọc, cả lớp đọc theo.","Giải thích whole là cái cả, part là phần."],
    say:[["Percent means per hundred.","Phần trăm nghĩa là trên một trăm.","Percent|per hundred"],
         ["The whole is one hundred percent.","Cái cả là một trăm phần trăm.","whole|one hundred percent"],
         ["A part of the whole is a percentage.","Một phần của cái cả là một tỉ lệ phần trăm.","part|percentage"],
         ["Zero point two five is a decimal.","Không phẩy hai mươi lăm là số thập phân.","decimal"],
         ["Repeat after me.","Nhắc lại theo cô/thầy.","Repeat"]],
    stu:[["___ percent is the same as zero point ___.","___ phần trăm bằng không phẩy ___.","percent"]],
    probs:[["25%","Twenty-five percent.","Hai mươi lăm phần trăm."],
           ["50%","Fifty percent.","Năm mươi phần trăm."],
           ["0.75","Zero point seven five.","Không phẩy bảy mươi lăm."],
           ["100%","One hundred percent.","Một trăm phần trăm."]]},
   {t:"Tính phần trăm của một số",min:15,lv:2,
    act:["Làm mẫu: 25% của 40. Chia 40 cho 100 được 0,4 rồi nhân 25 được 10; hoặc 25% là một phần tư nên chia 40 cho 4.","Viết lời giải bằng khung câu.","Phát phiếu 4 phép tính, các cặp làm và kiểm tra chéo."],
    say:[["We want twenty-five percent of forty.","Ta cần tìm hai mươi lăm phần trăm của bốn mươi.","twenty-five percent|forty"],
         ["Twenty-five percent is one quarter.","Hai mươi lăm phần trăm là một phần tư.","one quarter"],
         ["Forty divided by four is ten.","Bốn mươi chia bốn bằng mười.","divided by"],

const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function blank(en,keys){let s=en;keys.forEach(k=>{s=s.replace(new RegExp(reEsc(k),"i"),"___");});return s;}

const NW="zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million";

}

/* ================= MẶT THẺ THEO MỨC GIÀN GIÁO ================= */
function faceOf(id,L,rev){
  const full=L===1||rev;
  const st=STRR[id];
  if(st)return {kind:"s",cls:"ph",main:(L===3&&!rev)?st.it:st.frame,sub:(full&&st.ex.length)?st.ex[0].en:"",vi:full?st.vi:"",ex:"",say:st.ex.length?st.ex[0].en:st.frame,can:L>1,copy:true,id:id};
  const p=PH[id];
  if(p)return {kind:"p",cls:"ph",main:full?p.en:(L===2?p.frame:(p.keys.join(" · ")||p.frame)),sub:"",vi:full?p.vi:"",ex:"",say:p.en,can:L>1,copy:true,id:id};
  const r=RDR[id];
  if(r)return {kind:"r",cls:"sym",main:r.sym,sub:full?r.en:(L===2?r.frame:""),vi:full?r.vi:"",ex:"",say:r.en,can:L>1,g:r.g,id:id};
  const t=termById(id);if(!t)return null;
  let ex="";
  if(full&&t.ex)ex=t.ex+(t.exVi?"\n"+t.exVi:"");else if(L===2&&t.ex)ex=maskEx(t);
  return {kind:"t",cls:"term",main:t.en,sub:(L<=2||rev)?t.ipa:"",vi:full?t.vi:"",ex:ex,note:full?(t.note||""):"",say:t.en,can:L>1,t:t,id:id};
}
function gtag(g){return g?'<span class="tag" style="--gc:var(--g'+g+')">'+T("Lớp "+g,"Grade "+g)+'</span>':'<span class="tag">'+T("Mọi lớp","Any grade")+'</span>';}
const sayBtn=t=>'<button class="icon-btn" data-a="say" data-t="'+esc(t)+'" aria-label="'+T("Nghe mẫu","Listen")+'">'+ic("speaker")+'</button>';
const copyBtn=t=>'<button class="icon-btn" data-a="copy" data-t="'+esc(t)+'" aria-label="'+T("Chép câu","Copy")+'">'+ic("copy")+'</button>';
const favBtn=id=>'<button class="icon-btn fav'+(S.favs[id]?" on":"")+'" data-a="fav" data-v="'+esc(id)+'" aria-pressed="'+(S.favs[id]?"true":"false")+'" aria-label="'+T("Lưu vào kho","Save")+'">'+ic("star")+'</button>';
function firstWords(f){return f.split(/\s+/).slice(0,2).join(" ");}
function exHL(st,e){const parts=st.frame.split("___");let h=esc(parts[0]);e.fills.forEach((f,k)=>{h+='<mark>'+esc(f)+'</mark>'+esc(parts[k+1]||"");});return h;}
function structCard(id,showSit){
  const st=STRR[id],L=S.level,rev=!!S.rev[id],full=L===1||rev,l3=L===3&&!rev,vn=S.lang==="vi"?0:1;
  const sayT=st.ex.length?st.ex[0].en:st.frame;
  let h='<article class="card" data-card="'+esc(id)+'"><div class="row"><div class="head"><h3 class="ph">'+(l3?esc(st.it):fbk(st.frame))+'</h3></div><div class="acts">'+sayBtn(sayT)+micBtn(sayT,{vi:st.vi})+copyBtn(st.frame)+favBtn(id)+'</div></div>';
  if(l3)h+='<p class="fvh">'+T("Gợi ý mở đầu: ","Starts with: ")+esc(firstWords(st.frame))+' …</p>';
  if(full){h+='<p class="vi">'+fbk(st.vi)+'</p>';if(st.fv&&st.ex.length)h+='<p class="fvh">'+T("Chỗ trống: ","Blanks: ")+esc(st.fv)+'</p>';}
  if((full||L===2)&&st.ex.length){
    h+='<div class="exs"><p class="sublbl">'+T("Ví dụ","Examples")+'</p><ul class="exl">'+st.ex.map(e=>'<li><span class="tag" style="--gc:'+SUBJ[e.subj][2]+'">'+SUBJ[e.subj][vn]+'</span><span class="exb"><span class="ene">'+exHL(st,e)+'</span>'+(full?'<span class="vie">'+esc(e.vi)+'</span>':'')+'</span><button class="icon-btn mini" data-a="say" data-t="'+esc(e.en)+'" aria-label="'+T("Nghe ví dụ","Listen")+'">'+ic("speaker")+'</button></li>').join("")+'</ul></div>';
  }
  let meta="";
  if(showSit){const x=SIT.find(y=>y[1]===st.sit);meta+='<span class="tag n">'+x[2+vn]+'</span>';}
  if(S.known[id])meta+='';
  if(L>1)meta+='<button class="btn mini" data-a="rv" data-v="'+esc(id)+'">'+(rev?T("Ẩn đáp án","Hide answer"):T("Xem đáp án","Show answer"))+'</button>';
  meta+='<button class="btn mini'+(S.used[id]?' good':'')+'" data-a="used" data-v="'+esc(id)+'" aria-pressed="'+(S.used[id]?"true":"false")+'">'+(S.used[id]?T("Đã dùng ✓","Used ✓"):(S.role==="teacher"?T("Đã dùng trên lớp","Used in class"):T("Em đã nói","I said it")))+'</button>';
  if(meta)h+='<div class="meta">'+meta+'</div>';
  return h+'</article>';
}
function cardHTML(id){
  if(GRPR[id])return grpCard(id);
  if(WPR[id])return wpCard(id);
  if(STRR[id])return structCard(id,!(S.view==="inter"&&!S.iq.trim()));
  const rev=!!S.rev[id];const f=faceOf(id,S.level,rev);if(!f)return "";
  let h='<article class="card" data-card="'+esc(id)+'"><div class="row"><div class="head"><h3 class="'+f.cls+'">'+fbk(f.main)+'</h3>'+(f.kind==="t"&&f.sub?'<span class="ipa">'+esc(f.sub)+'</span>':'')+'</div><div class="acts">'+sayBtn(f.say)+(f.kind==="t"?micBtn(f.say,{e:f.t.ex,evi:f.t.exVi,vi:f.t.vi}):micBtn(f.say,{vi:f.vi}))+(f.copy?copyBtn(f.say):'')+favBtn(id)+'</div></div>';
  if(f.kind==="t")h+=ilFor(f.t.en);
  if(f.kind==="r"&&f.sub)h+='<p class="reading">'+fbk(f.sub)+'</p>';
  if(f.vi)h+='<p class="vi"'+(f.kind==="r"?' style="font-weight:500;color:var(--muted)"':'')+'>'+esc(f.vi)+'</p>';
  if(f.ex){const ls=f.ex.split("\n");h+='<p class="ex">'+fbk(ls[0])+(ls[1]?'<span>'+esc(ls[1])+'</span>':'')+'</p>';}
  if(f.kind==="t"&&f.note)h+='<p class="fvh">'+T("Anh – Mỹ: ","UK – US: ")+esc(f.note)+'</p>';
  let meta="";
  if(f.kind==="t"){meta+=gtag(f.t.g)+'<span class="tag n">'+esc(TOPICS[f.t.topic][S.lang==="vi"?0:1])+'</span>'+(S.known[id]?'<span class="tag ok">'+T("Đã nhớ","Known")+'</span>':'');}
  if(f.kind==="r")meta+=gtag(f.g);
  if(f.can)meta+='<button class="btn mini" data-a="rv" data-v="'+esc(id)+'">'+(rev?T("Ẩn đáp án","Hide answer"):T("Xem đáp án","Show answer"))+'</button>';
  if(meta)h+='<div class="meta">'+meta+'</div>';
  return h+'</article>';
}

function markTerm(id,ok){
  if(!id)return;
  if(ok){S.known[id]=1;delete S.weak[id];}else{delete S.known[id];S.weak[id]=1;}
  store.set("known",S.known);store.set("weak",S.weak);
}

     +'<button data-a="setrole" data-v="student">'+mascot("rabbit",56)+'<b>'+T("Học sinh","Student")+'</b><span>'+T("Có Trò chơi để ôn bài","Games to review")+'</span></button></div>'
     +'<p class="sub" style="font-size:.84rem">'+T("Có thể đổi vai trò bất cứ lúc nào ở góc trên bên phải.","You can switch role any time, top right.")+'</p></section>';
  }

               :T("Mỗi ngày một ít, em sẽ nói được nhiều hơn. Cùng học nào!","A little each day and you will say more. Let's learn!");

  h+='<h2>'+T("Tiến độ của bạn","Your progress")+'</h2><div class="stats-grid">'

/* ================= NHÌN HÌNH: luyện tập và trò chơi bằng hình ================= */
/* Từ có hình nhưng dễ gây nhầm khi chọn giữa nhiều hình: chỉ dùng ở chế độ "Nhìn hình nói" */
const PIC_SKIP=new Set(["angle","triangle","side","side length","corner","vertex","length","width","height","base","part","fraction","unit fraction","equal parts","area","perimeter","quadrilateral","midpoint"]);
/* Các nhóm hình na ná nhau: một câu hỏi chỉ dùng tối đa một hình trong mỗi nhóm */
const PIC_EXC=[["circle","centre","radius","diameter","circumference"],["equilateral triangle","right-angled triangle","acute triangle","obtuse triangle"],["square","rectangle","rhombus","parallelogram","trapezium"],["cube","cuboid","face","edge","net"],["numerator","denominator"],["above","below","left","right","in front of","behind","between"],["greater than","less than","equal to"],["ones","tens","hundreds","place value"]];
const picGrp=en=>{const k=String(en).toLowerCase();for(let i=0;i<PIC_EXC.length;i++)if(PIC_EXC[i].indexOf(k)>=0)return i;return -1;};
function picPool(forQ){
  const seen={},out=[];
  allTerms().forEach(t=>{
    const k=String(t.en).toLowerCase(),f=ILL[k];if(!f)return;
    if(!(S.grade===0||t.g===0||t.g<=S.grade))return;
    if(forQ&&PIC_SKIP.has(k))return;
    const sv=f();if(seen[sv])return;seen[sv]=1;out.push(t);
  });
  return out;
}
function picOptions(t,list){
  const used=[picGrp(t.en)].filter(x=>x>=0);
  const cand=shuffle(list.filter(x=>x.id!==t.id));
  const order=cand.filter(x=>x.topic===t.topic).concat(cand.filter(x=>x.topic!==t.topic));
  const ds=[];
  for(const x of order){const g=picGrp(x.en);if(g>=0&&used.indexOf(g)>=0)continue;if(g>=0)used.push(g);ds.push(x);if(ds.length===3)break;}
  if(ds.length<3)return null;
  const opts=shuffle([t].concat(ds));
  return {opts:opts,idx:opts.findIndex(o=>o.id===t.id)};
}
function picQ(i,L,force){
  const qp=picPool(true),t=pick(qp),o=picOptions(t,qp);
  if(!o)return null;
  const p2w=force!==undefined?force:((L===3)?(i%3===2):(i%2===0));
  if(p2w)return {kind:"p",pic:ilFor(t.en),hint:T("Đây là gì?","What is this?"),opts:o.opts.map(x=>x.en),idx:o.idx,say:t.en,ans:t.en};
  const aud=L===3&&hasTTS();
  return {kind:"p",prompt:aud?"":t.en,cls:"big",hint:aud?T("Nghe và chọn hình đúng","Listen and pick the picture"):T("Chọn hình đúng","Pick the right picture"),opts:o.opts.map(x=>ilFor(x.en)),optPic:true,idx:o.idx,say:t.en,ans:t.en,audio:aud};
}

/* ================= NÓI THEO: nghe giọng học sinh và chấm từng từ ================= */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const SP_OPT={a:1,an:1,the:1,and:1,of:1};
const SP_CONTR={"it's":"it is","i'm":"i am","don't":"do not","doesn't":"does not","can't":"can not","cannot":"can not","what's":"what is","there's":"there is","that's":"that is","let's":"let us","isn't":"is not","aren't":"are not","he's":"he is","she's":"she is","you're":"you are","we're":"we are","they're":"they are","i've":"i have","i'll":"i will","won't":"will not","here's":"here is","who's":"who is","how's":"how is"};
const SP_ABB={cm:"centimetre",mm:"millimetre",km:"kilometre",kg:"kilogram",ml:"millilitre"};
const SP_CANON={};
[["two","to","too"],["four","for","fore"],["eight","ate"],["one","won"],["no","know"],["right","write"],["there","their","theyre"],["sum","some"],["hour","our"],["metre","meter"],["centimetre","centimeter"],["millimetre","millimeter"],["kilometre","kilometer"],["litre","liter"],["millilitre","milliliter"],["tonne","ton"],["be","bee"],["see","sea"],["by","buy","bye"],["tail","tale"],["pair","pear"],["whole","hole"],["minus","minuses"],["three","tree","free"],["thousand","tousand","sousand"],["this","dis"],["that","dat"],["thank","tank"],["think","sink","tink"],["thirty","dirty"],["third","tird"]].forEach(g=>g.forEach(w=>SP_CANON[w]=g[0]));
function spTok(t){
  t=String(t).toLowerCase().replace(/[’‘`]/g,"'");
  t=t.replace(/(\d+)\.(\d+)/g,(m,a,b)=>" "+nw(+a)+" point "+b.split("").map(d=>NO[+d]).join(" ")+" ");
  t=t.replace(/\d+/g,m=>" "+(m.length<=4?nw(+m):m.split("").map(d=>NO[+d]).join(" "))+" ");
  t=t.replace(/%/g," percent ").replace(/°/g," degrees ").replace(/\+/g," plus ").replace(/×/g," times ").replace(/=/g," equals ").replace(/[-–—]/g," ").replace(/½/g," one half ");
  t=t.replace(/[^a-z' ]/g," ");
  let w=t.split(/\s+/).filter(Boolean);
  const o=[];
  w.forEach(x=>{if(SP_CONTR[x])SP_CONTR[x].split(" ").forEach(y=>o.push(y));else if(SP_ABB[x])o.push(SP_ABB[x]);else o.push(x.replace(/'/g,""));});
  return o.filter(Boolean);
}
function spCanon(w){if(w.length>3&&/[^s]s$/.test(w)&&!SP_CANON[w])w=w.slice(0,-1);return SP_CANON[w]||w;}
function spLev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}
const spEq=(a,b)=>a===b||(a.length>=5&&b.length>=5&&spLev(a,b)<=1);
function spAlign(T0,H){
  const n=T0.length,m=H.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=spEq(T0[i-1],H[j-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const hit=Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(spEq(T0[i-1],H[j-1])&&d[i][j]===d[i-1][j-1]+1){hit[i-1]=true;i--;j--;}else if(d[i-1][j]>=d[i][j-1])i--;else j--;}
  return hit;
}
/* so sánh lời nói với một hay nhiều câu mẫu, chọn cách khớp tốt nhất */
function spScore(variants,heard){
  let best=null;
  variants.forEach((tx,vi)=>{
    const ts=spTok(tx);if(!ts.length)return;const tc=ts.map(spCanon);
    heard.forEach(h=>{
      const hs=spTok(h).map(spCanon);const hit=spAlign(tc,hs);
      let req=ts.filter(w=>!SP_OPT[w]).length;const allOpt=req===0;
      let ok=0,words=ts.map((w,i)=>{const opt=SP_OPT[w]&&!allOpt;if(hit[i]){if(!opt)ok++;return {w:w,s:"ok"};}return {w:w,s:opt?"opt":"miss"};});
      const tot=allOpt?ts.length:req;
      const matched=hit.filter(Boolean).length,extra=Math.max(0,hs.length-matched);
      const r={vi:vi,text:tx,words:words,ok:ok,tot:tot,ratio:ok/tot,extra:extra,heard:h,pass:(tot-ok)<=Math.floor(tot/5)};
      if(!best||r.ratio>best.ratio+1e-9||(Math.abs(r.ratio-best.ratio)<1e-9&&r.extra<best.extra))best=r;
    });
  });
  return best;
}
const hasSR=()=>!!SRC;
let spRec=null,spTimer=null,spAdvT=null;
const spMap=()=>store.get("spk",{});
function spRecord(key,text,pass){
  const m=spMap();const e=m[key]||{n:0,ok:0};e.n++;if(pass)e.ok++;e.last=pass?1:0;e.ts=Date.now();e.t=text;m[key]=e;
  const ks=Object.keys(m);if(ks.length>400){ks.sort((a,b)=>m[a].ts-m[b].ts).slice(0,ks.length-400).forEach(k=>delete m[k]);}
  store.set("spk",m);
}
function spAbort(){clearTimeout(spTimer);clearTimeout(spAdvT);if(spRec){try{spRec.onend=null;spRec.abort();}catch(e){}spRec=null;}}
function spOpen(o){spAbort();S.sp=Object.assign({ti:0,state:"idle",heard:"",alts:[],res:null,err:null,tries:0,done:null},o);render();}
function spClose(){spAbort();S.sp=null;render();}
function spStart(){
  const sp=S.sp;if(!sp)return;
  if(!SRC){sp.state="nosr";render();return;}
  try{speechSynthesis.cancel();}catch(e){}
  spAbort();
  const r=new SRC();r.lang=S.nsty==="us"?"en-US":"en-GB";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  sp.state="listen";sp.heard="";sp.alts=[];sp.err=null;sp.res=null;sp.done=null;
  r.onresult=e=>{
    S.micOK=true;
    const fin=[];let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){for(let j=0;j<res.length;j++)fin.push(res[j].transcript);}else interim+=res[0].transcript;}
    if(fin.length)sp.alts=fin;
    sp.heard=fin.length?fin[0]:interim;
    const el=$("#sphear");if(el)el.textContent=sp.heard?"“"+sp.heard+"”":"";
  };
  r.onerror=e=>{sp.err=e.error||"error";};
  r.onend=()=>{clearTimeout(spTimer);spRec=null;if(S.sp===sp)spFinish();};
  spRec=r;
  try{r.start();}catch(e){spRec=null;sp.err="start";spFinish();return;}
  spTimer=setTimeout(()=>{try{r.stop();}catch(e){}},9000);
  render();
}
function spFinish(){
  const sp=S.sp;if(!sp)return;
  const bad={"not-allowed":"denied","service-not-allowed":"denied","network":"offline","audio-capture":"nomic"};
  if(sp.err&&bad[sp.err]&&!sp.alts.length){sp.state=bad[sp.err];render();return;}
  const heard=sp.alts.length?sp.alts:(sp.heard?[sp.heard]:[]);
  if(!heard.length){sp.state="nospeech";render();return;}
  const tg=sp.targets[sp.ti];const vars=[tg.text].concat(tg.alts||[]);
  const res=spScore(vars,heard);
  sp.res=res;sp.state="result";
  if(res){
    spRecord(sp.key||("x:"+spTok(tg.text).join(" ")),tg.text,res.pass);
    if(sp.r){
      if(res.pass){S.rate[sp.r]=3;store.set("rate",S.rate);markTerm(sp.r,true);}
      else if(!sp.seq||(sp.tries||0)>=2){S.rate[sp.r]=1;store.set("rate",S.rate);markTerm(sp.r,false);}
    }
    if(res.pass){
      if(sp.seq){sp.done="pass";spSchedule(1400);}
    }else if(sp.seq){
      sp.tries=(sp.tries||0)+1;
      if(sp.tries>=3){sp.done="give";spSchedule(Math.min(7000,2800+tg.text.length*70));}
      else if(sp.tries>=2&&sp.qa&&sp.show==="none")sp.show="frame";
    }
  }
  render();
  if(sp.done==="give"&&S.sp===sp)say(tg.text,.85);
}
function micBtn(t,o){
  o=o||{};if(!t||/_{2,}/.test(t))return "";
  return '<button class="icon-btn mic" data-a="spk" data-t="'+esc(t)+'"'+(o.e?' data-e="'+esc(o.e)+'"':'')+(o.vi?' data-vi="'+esc(o.vi)+'"':'')+(o.evi?' data-evi="'+esc(o.evi)+'"':'')+(o.r?' data-r="'+esc(o.r)+'"':'')+' aria-label="'+T("Nói theo, máy sẽ nghe và chấm","Say it, the device will listen and check")+'">'+ic("mic")+'</button>';
}

function icoGrid(k,n,x0,y0,cols,gx,gy,cross){

  else if(L===2)ans='<div class="card"><p class="sublbl">'+T("Khung câu","Sentence frame")+'</p><p class="big ph">'+fbk(it.f)+'</p></div>';
  const bubble='<div class="msg">'+mascot("rabbit",36)+'<div class="bub"><b>'+esc(it.q)+'</b><span class="vie">'+(L===1||rev?esc(it.qv):"")+'</span>'+(it.ctx?'<span class="narr" style="display:block;margin-top:4px">'+esc(it.ctx)+'</span>':'')+'</div>'+sayBtn(it.q)+'</div>';
  return intro+dev+chips+stats+'<div class="stats num"><span>'+T("Câu ","Question ")+'<b>'+pos+'/'+q.order.length+'</b></span></div>'
   +(it.pic?'<div class="card qapic">'+it.pic+'</div>':'')
   +'<div class="chat">'+bubble+'</div>'
   +'<div class="btns"><button class="btn pri" data-a="qaspeak">'+ic("mic")+' '+T("Trả lời bằng giọng nói","Answer aloud")+'</button>'+(L>1?'<button class="btn" data-a="rv" data-v="'+it.id+'">'+(rev?T("Ẩn đáp án","Hide answer"):T("Xem đáp án","Show answer"))+'</button>':'')+'<button class="btn" data-a="qanext">'+T("Câu tiếp","Next")+' '+ic("right")+'</button></div>'+ans;

function qaOpen(it,auto){

  if(auto)spAuto(S.sp,it.q);
}
function qaStep(){
  const q=S.qa;if(!q||!q.order.length)return false;
  q.i++;if(q.i>=q.order.length){const sub=q.sub;S.qa={sub:sub};qaInit();}
  S.rev={};return true;
}
function qaNext(){
  if(!qaStep())return;render();

}

/* ================= NÓI LIÊN TỤC: nghe câu, nói, tự chuyển câu ================= */
function spSayThen(text,cb){
  let done=false,tm=null;const fin=()=>{if(done)return;done=true;clearTimeout(tm);cb();};
  tm=setTimeout(fin,Math.min(12000,2500+String(text).length*110));
  if(!hasTTS()){clearTimeout(tm);tm=setTimeout(fin,350);return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/_+/g," blank ").replace(/\s+/g," "));u.lang="en-US";u.rate=.9;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}catch(e){fin();}
}
function spAuto(sp,text){
  if(!sp||!sp.seq)return;
  const go=()=>{if(S.sp===sp&&sp.state==="idle"&&S.micOK)spStart();};
  if(text)spSayThen(text,go);else go();
}
function spSchedule(ms){clearTimeout(spAdvT);const sp=S.sp;spAdvT=setTimeout(()=>{if(S.sp===sp)spAdvance();},ms);}
function spAdvance(){
  const sp=S.sp;if(!sp)return;clearTimeout(spAdvT);spAbort();
  const k=sp.seq;
  if(k==="qa"){if(qaStep()){qaOpen(qaCur(),true);return;}}
  else if(k==="sh"){S.sh.pos=(S.sh.pos||0)+1;shOpen(true);return;}
  else if(k==="tq"){const t=S.tq,n=tqItems().length;if(n){if(!t.ord||t.ord.length!==n){t.ord=seqOrder(n);t.pos=-1;}t.pos++;if(t.pos>=n){t.ord=seqOrder(n);t.pos=0;}tqOpen(t.ord[t.pos],true,false,(t.pos+1)+"/"+n);return;}}
  spClose();
}
const seqOrder=n=>{const a=[];for(let i=0;i<n;i++)a.push(i);return shuffle(a);};
function shValid(){return shItems().map((id,i)=>{const f=faceOf(id,1,true);return (f&&f.say&&!/_{2,}/.test(f.say))?i:-1;}).filter(i=>i>=0);}
function shStart(){const v=shValid();if(!v.length)return;S.sh.ord=shuffle(v);S.sh.pos=0;shOpen(false);}
function shOpen(auto){
  const items=shItems();if(!items.length)return;
  if(!S.sh.ord||S.sh.ord.some(i=>i>=items.length)){const v=shValid();if(!v.length)return;S.sh.ord=shuffle(v);S.sh.pos=0;}
  if(!(S.sh.pos<S.sh.ord.length)){S.sh.ord=shuffle(shValid());S.sh.pos=0;}
  S.sh.i=S.sh.ord[S.sh.pos];
  const id=items[S.sh.i],f=faceOf(id,1,true);
  spOpen({title:T("Nghe và nói","Listen & speak"),targets:[{label:"",text:f.say,vi:f.vi||""}],show:"full",r:id,seq:"sh",next:true,prog:(S.sh.pos+1)+"/"+S.sh.ord.length});
  if(auto)spAuto(S.sp,f.say);
}

/* ================= TRA CỨU ================= */
/* ================= ĐỌC SỐ: lõi chuyển số sang chữ Anh ================= */
const N1=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const N10=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const NSC=["","thousand","million","billion","trillion"];
const NORD={2:"half",3:"third",4:"quarter",5:"fifth",6:"sixth",7:"seventh",8:"eighth",9:"ninth",10:"tenth",100:"hundredth",1000:"thousandth"};
function w100(n){if(n<20)return N1[n];const t=Math.floor(n/10),o=n%10;return N10[t]+(o?"-"+N1[o]:"");}
function w1000(n,uk){const h=Math.floor(n/100),r=n%100;if(!h)return w100(r);let s=N1[h]+" hundred";if(r)s+=(uk?" and ":" ")+w100(r);return s;}
function intWords(str,uk){
  str=String(str).replace(/^0+(?=\d)/,"");
  if(str==="0")return "zero";
  if(str.length>15)return null;
  const gs=[];for(let i=str.length;i>0;i-=3)gs.unshift(+str.slice(Math.max(0,i-3),i));
  const parts=[];
  gs.forEach((g,i)=>{if(!g)return;const sc=NSC[gs.length-1-i];parts.push({g:g,t:w1000(g,uk)+(sc?" "+sc:"")});});
  let out="";
  parts.forEach((p,i)=>{
    if(i===0){out=p.t;return;}
    const last=i===parts.length-1;
    if(last&&p.g<100)out+=(uk?" and ":" ")+p.t;else out+=", "+p.t;
  });
  return out;
}
function ordW(n){
  const OR=["","first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth"];
  const sp={11:"eleventh",12:"twelfth",13:"thirteenth",14:"fourteenth",15:"fifteenth",16:"sixteenth",17:"seventeenth",18:"eighteenth",19:"nineteenth"};
  const tw=["","","twentieth","thirtieth","fortieth","fiftieth","sixtieth","seventieth","eightieth","ninetieth"];
  if(n<=10)return OR[n];if(sp[n])return sp[n];
  const t=Math.floor(n/10),o=n%10;return o?N10[t]+"-"+OR[o]:tw[t];
}
function decW(s,uk){
  const p=s.split(".");const ip=intWords(p[0],uk);if(!ip)return null;
  return ip+" point "+p[1].split("").map(c=>N1[+c]).join(" ");
}
function fracWords(n,d,uk){
  const nn=+n,dd=+d;
  if(dd===0)return {err:"Mẫu số không được bằng 0."};
  const nw=intWords(n,uk),dw=intWords(d,uk);
  if(!nw||!dw)return {err:"Số quá lớn (tối đa 15 chữ số)."};
  const pl=nn===1?"":"s";let en,why,alts=[];
  if(dd===2){en=nw+(nn===1?" half":" halves");why="Mẫu số 2 đọc là half (số nhiều: halves).";if(nn===1)alts.push({en:"a half",why:"Cũng thường nói a half."});}
  else if(dd===4){en=nw+(nn===1?" quarter":" quarters");why="Mẫu số 4 thường đọc là quarter (số nhiều: quarters).";alts.push({en:nw+(nn===1?" fourth":" fourths"),why:"Đọc theo quy tắc chung, phổ biến ở Mỹ."});}
  else if(dd>2&&NORD[dd]){en=nw+" "+NORD[dd]+pl;why="Tử số đọc như số đếm, mẫu số đọc như số thứ tự"+(nn===1?".":", thêm s vì tử số lớn hơn 1.");}
  else{en=nw+" over "+dw;why="Mẫu số khó đọc: dùng over cho dễ nói (a over b).";if(dd>10&&dd<100)alts.push({en:nw+" "+ordW(dd)+pl,why:"Cách đọc đầy đủ theo số thứ tự."});}
  return {en:en,why:why,alts:alts};
}
function plainNum(b,uk){
  b=b.trim();
  if(/^\d+$/.test(b)||/^\d{1,3}(\s\d{3})+$/.test(b)){
    const w=intWords(b.replace(/\s/g,""),uk);
    return w?{en:w,why:"Số nguyên: tách từng nhóm 3 chữ số từ phải sang trái, đọc mỗi nhóm rồi thêm thousand, million…"}:{err:"Số quá lớn (tối đa 15 chữ số)."};
  }
  if(/^\d{1,3}(,\d{3})+$/.test(b)){
    const int=b.replace(/,/g,"");
    const r={en:intWords(int,uk),why:"Dấu phẩy trong số tiếng Anh ngăn cách các nhóm 3 chữ số: "+b+" = "+int+"."};
    if(/^\d{1,3},\d{3}$/.test(b)){const dot=b.replace(",",".");r.alts=[{en:decW(dot,uk),why:"Nếu viết kiểu Việt Nam thì "+b+" là số thập phân "+dot+", đọc là:"}];}
    return r;
  }
  if(/^\d{1,3}(\.\d{3})+$/.test(b)){
    const int=b.replace(/\./g,"");
    const r={en:intWords(int,uk),why:"Kiểu Việt Nam: dấu chấm ngăn cách hàng nghìn ("+b+" = "+int+")."};

    if(/^\d{1,3}\.\d{3}$/.test(b))r.alts=[{en:decW(b,uk),why:"Nếu đây là số thập phân kiểu Anh thì "+b+" đọc là:"}];
    return r;
  }
  if(/^\d+\.\d+$/.test(b)){const w=decW(b,uk);return w?{en:w,why:"Số thập phân: đọc phần nguyên, nói point, rồi đọc TỪNG chữ số một."}:{err:"Số quá lớn (tối đa 15 chữ số)."};}
  if(/^\d+,\d+$/.test(b)){const dot=b.replace(",",".");const w=decW(dot,uk);return w?{en:w,why:"Việt Nam viết dấu phẩy, tiếng Anh viết dấu chấm: "+b+" → "+dot+". Đọc phần nguyên, nói point, rồi từng chữ số.",notes:["Tiếng Anh viết "+dot+" (dấu chấm), không viết "+b+"."]}:{err:"Số quá lớn (tối đa 15 chữ số)."};}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const ROMAN22=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI","XXII"];
function yearW(y,uk){
  if(y>=2000&&y<=2009)return intWords(String(y),uk);
  if(y>=1100&&y<2100||y>=2010&&y<=2099){
    const hi=Math.floor(y/100),lo=y%100;
    if(lo===0)return intWords(String(hi),uk)+" hundred";
    return intWords(String(hi),uk)+" "+(lo<10?"oh "+intWords(String(lo),uk):intWords(String(lo),uk));
  }
  return intWords(String(y),uk);
}
function readNum(raw,uk){
  let s=String(raw).trim().replace(/−/g,"-");if(!s)return null;
  let pre="";if(s[0]==="-"){pre="minus ";s=s.slice(1).trim();}
  let m;
  if(/^[IVXivx]+$/.test(s)){
    const ix=ROMAN22.indexOf(s.toUpperCase());
    if(ix<0||pre)return {err:"Chỉ đọc số La Mã từ I đến XXII."};
    const n=ix+1;
    return {en:nw(n),why:"Số đếm",alts:[{en:"the "+ordW(n)+" century",why:"Thế kỉ"}]};
  }
  {
    let dm=s.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})$/),dd,mm,yy,hasY=true;
    if(!dm){const v=s.match(/^ngày\s*(\d{1,2})\s*tháng\s*(\d{1,2})(?:\s*năm\s*(\d{1,4}))?$/i);if(v){dm=v;hasY=!!v[3];}}
    if(dm&&!pre){
      dd=+dm[1];mm=+dm[2];yy=hasY?+dm[3]:2000;
      const dt=new Date(yy,mm-1,dd);if(yy<100)dt.setFullYear(yy);
      if(mm<1||mm>12||dd<1||dt.getDate()!==dd||dt.getMonth()!==mm-1)return {err:"Ngày tháng không hợp lệ. Hãy nhập theo thứ tự ngày/tháng/năm, ví dụ 20/10/2026."};
      const yw=hasY?", "+yearW(yy,uk):"";
      const en=uk?"the "+ordW(dd)+" of "+MONTHS[mm-1]+yw:MONTHS[mm-1]+" "+ordW(dd)+yw;
      return {en:cap(en),why:"Đọc theo thứ tự Việt Nam: ngày/tháng/năm.",notes:["Người Mỹ thường viết tháng trước ngày, nhưng ứng dụng luôn đọc theo thứ tự ngày/tháng/năm."]};
    }
  }
  if(s.indexOf(":")>=0){
    const ps=s.split(":").map(x=>x.trim());
    const ws=ps.map(p=>{if(!(/^\d+$/.test(p)||/^\d+[.,]\d+$/.test(p)))return null;const r=plainNum(p,uk);return r.err?null:r.en;});
    if(ps.length>=2&&ws.every(Boolean))return {en:pre+ws.join(" to "),why:"Tỉ số: đọc to ở giữa các số. Khác với phân số (2:3 đọc two to three, còn 2/3 đọc two thirds)."};
    return {err:"Tỉ số cần dạng a:b, ví dụ 2:3."};
  }
  if(/%\s*$/.test(s)){
    const r=plainNum(s.replace(/%\s*$/,""),uk);if(r.err)return r;
    return {en:pre+r.en+" percent",why:"Phần trăm: đọc số rồi thêm percent (không thêm s).",alts:(r.alts||[]).map(a=>({en:a.en+" percent",why:a.why})),notes:r.notes};
  }
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    const f=fracWords(m[2],m[3],uk);if(f.err)return f;const w=intWords(m[1],uk);if(!w)return {err:"Số quá lớn (tối đa 15 chữ số)."};
    return {en:pre+w+" and "+f.en,why:"Hỗn số: đọc phần nguyên, thêm and, rồi đọc phân số. "+f.why,alts:f.alts.map(a=>({en:w+" and "+a.en,why:a.why}))};
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    const f=fracWords(m[1],m[2],uk);if(f.err)return f;
    return {en:pre+f.en,why:f.why,alts:f.alts};
  }
  const r=plainNum(s,uk);if(r.err)return r;
  return {en:pre+r.en,why:r.why,alts:r.alts,notes:r.notes};
}

  });

}
function grpHit(x,q,fn){
  const qt=wclean(fn(q)).split(" ").filter(Boolean),kt=wclean(fn(x.kw)).split(" ");
  return qt.length>0&&qt.every(a=>kt.some(k=>k.indexOf(a)===0));
}
function termSearch(q){
  const qs=q.trim();
  let all=allTerms();if(S.topic!=="all")all=all.filter(t=>t.topic===S.topic);
  const cur=t=>(S.grade===0||t.g===0||t.g===S.grade)?0:1;
  const passes=dia(qs)!==norm(qs)?[dia,norm]:[norm];
  for(let i=0;i<passes.length;i++){
    const fn=passes[i];
    const r=all.map(t=>[t,termScore(t,qs,fn)]).filter(x=>x[1]>0);
    const gr=(S.topic==="all"&&wclean(qs).length>=2)?GRPS.filter(x=>grpHit(x,qs,fn)):[];
    if(r.length||gr.length){
      r.sort((a,b)=>b[1]-a[1]||cur(a[0])-cur(b[0])||a[0].g-b[0].g);
      return {terms:r.map(x=>x[0]),groups:gr};
    }
  }
  const nq=norm(qs);
  const l=all.filter(t=>norm(t.ex+" "+t.exVi).includes(nq)).sort((a,b)=>cur(a)-cur(b)||a.g-b.g);
  return {terms:l,groups:[]};
}

function itCurCat(){
  const sits=SIT.filter(x=>x[0]===S.it.dir);
  if(sits.length===1)return sits[0];
  return sits.find(x=>x[1]===S.it.cat)||null;

function itSearch(q){
  const STOP={hoc:1,sinh:1,em:1,co:1,thay:1,cac:1,ban:1,va:1,la:1,cho:1,cua:1,nao:1,muon:1,noi:1,toi:1,ve:1,de:1,khi:1,duoc:1};
  let toks=norm(q).split(/\s+/).filter(x=>x.length>1);
  const keep=toks.filter(x=>!STOP[x]);if(keep.length)toks=keep;
  if(!toks.length)return [];
  const has=(h,t)=>(" "+h).indexOf(" "+t)>=0;
  const nq=norm(q).trim();
  const sitName={};SIT.forEach(x=>{sitName[x[1]]=x[2];});
  
  return STR.map(st=>{
    const a=norm(st.it+" "+st.kw);
    const b=norm(st.vi+" "+st.frame+" "+sitName[st.sit]+" "+st.ex.map(e=>e.vi+" "+e.en).join(" "));
    let sc=0;toks.forEach(t=>{if(has(a,t))sc+=2;else if(has(b,t))sc+=1;});if(a.includes(nq))sc+=3;
    return {id:st.id,sc:sc};
  }).filter(x=>x.sc>=(toks.length>1?2:1)).sort((x,y)=>y.sc-x.sc).slice(0,15).map(x=>x.id);
}

const RP_BY={};RP.forEach(x=>RP_BY[x.id]=x);
function rpSplit(s){const m=/^(\([^)]*\))\s*(.*)$/.exec(s);return m?{n:m[1],t:m[2]}:{n:"",t:s};}
const rpSpeak=s=>String(s).replace(/\([^)]*\)/g,"").trim();
function rpAdv(){
  const rp=S.rp,sc=RP_BY[rp.id];let last="";
  while(rp.i<sc.nodes.length&&sc.nodes[rp.i].a){const n=sc.nodes[rp.i];rp.log.push({who:"app",en:n.a[0],vi:n.a[1]});last=n.a[0];rp.i++;}
  if(rp.i<sc.nodes.length){rp.ord=shuffle(sc.nodes[rp.i].o.map((x,k)=>k));rp.show=S.level<3;}
  else{rp.done=true;const pct=rp.max?Math.round(rp.score/rp.max*100):0;if(pct>(S.rpbest[rp.id]||0)){S.rpbest[rp.id]=pct;store.set("rpbest",S.rpbest);}}
  if(last){const t=rpSpeak(last);if(t)setTimeout(()=>say(t),150);}
}
function rpBubble(m,side){
  const sp=rpSplit(m.en),vi=rpSplit(m.vi);
  const who=m.who==="you";
  const av=who?"":mascot(side==="t"?"rabbit":"owl",36);
  return '<div class="msg'+(who?' you':'')+'">'+av+'<div class="bub">'+(sp.n?'<span class="narr">'+esc(sp.n)+'</span> ':'')+esc(sp.t)+((S.rp.vi||who)?'<span class="vie">'+esc(vi.n&&!sp.n?vi.n+" "+vi.t:vi.t)+'</span>':'')+'</div>'+(!who&&rpSpeak(m.en)?'<button class="icon-btn mini" data-a="say" data-t="'+esc(rpSpeak(m.en))+'" aria-label="'+T("Nghe","Listen")+'">'+ic("speaker")+'</button>':'')+'</div>';
}

  }

  if(!rp.show&&!picked)return h+'<div class="card"><p>'+T("Mức 3: hãy tự nói câu trả lời của bạn thành tiếng trước, rồi mới xem các lựa chọn.","Level 3: say your own reply aloud first, then look at the choices.")+'</p></div><button class="btn pri" data-a="rpshow">'+T("Xem các lựa chọn","Show choices")+'</button>';

  if(picked){
    const o=node.o[rp.pick],best=node.o.find(x=>x[2]===2);
    const lab=o[2]===2?T("Rất tự nhiên!","Very natural!"):(o[2]===1?T("Được, nhưng có thể tốt hơn.","OK, but it can be better."):T("Chưa phù hợp.","Not a good fit."));
    h+='<div class="fb f'+o[2]+'"><b>'+lab+'</b> '+esc(o[3])+(o[4]?'<p style="margin-top:4px">'+T("Khung câu: ","Frame: ")+fbk(o[4])+'</p>':'')+(o[2]<2?'<p style="margin-top:4px">'+T("Gợi ý: ","Better: ")+esc(best[0])+'</p>':'')+'</div><button class="btn pri" data-a="rpnext">'+T("Tiếp","Next")+' '+ic("right")+'</button>';
  }
  return h;
}

function studyPool(){let p=pool();if(S.onlyFav)p=p.filter(t=>S.favs[t.id]);else if(S.onlyWeak)p=p.filter(t=>S.weak[t.id]);return p;}
function initPrac(){
  S.rp=null;S.qz={cur:null,score:0,n:0};S.ty={cur:null,score:0,n:0,hint:false,res:null,val:""};S.sh.i=0;if(S.qa)qaInit();
}
function mkOptions(correct,labelFn,list){
  if(S.grade>0){
    const ok=list.filter(x=>x.id===correct.id||!x.g||x.g<=S.grade);
    if(new Set(ok.map(labelFn)).size>=4)list=ok;
  }
  const same=shuffle(list.filter(x=>x.id!==correct.id&&x.topic===correct.topic));
  const rest=shuffle(list.filter(x=>x.id!==correct.id&&x.topic!==correct.topic));
  const seen=new Set([labelFn(correct)]);const ds=[];
  for(const x of same.concat(rest)){const l=labelFn(x);if(!seen.has(l)){seen.add(l);ds.push(x);}if(ds.length===3)break;}
  const opts=shuffle([correct].concat(ds));
  return {opts:opts,idx:opts.indexOf(correct)};
}
function nextItem(prev){
  const p=studyPool();const src=p.length?p:allTerms();
  let t=pick(src);let tries=0;
  while(prev&&t.id===prev&&src.length>1&&tries<6){t=pick(src);tries++;}
  return t;
}
function newQuiz(){
  const L=S.level;
  if(S.qz.n%3===2){
    const pp=picPool(true);
    if(pp.length>=4){
      const t2=pick(pp),o=picOptions(t2,pp);
      if(o){S.qz.cur={item:t2,mode:(Math.floor(S.qz.n/3)%2===0)?"p2w":"w2p",opts:o.opts,idx:o.idx,picked:null};return;}
    }
  }
  const t=nextItem(S.qz.cur&&S.qz.cur.item.id);
  let mode=L===1?"e2v":(L===2?"v2e":"cz");
  if(mode==="cz"&&!canCloze(t))mode="v2e";
  const m=mode==="e2v"?mkOptions(t,x=>x.vi,allTerms()):mkOptions(t,x=>x.en,allTerms());
  S.qz.cur={item:t,mode:mode,opts:m.opts,idx:m.idx,picked:null};
}
function newTyping(){
  let t=null;
  if(Math.random()<.4){const ids=new Set(studyPool().map(x=>x.id));const pp=picPool(true).filter(x=>ids.has(x.id)&&x.id!==(S.ty.cur&&S.ty.cur.id));if(pp.length)t=pick(pp);}
  S.ty.cur=t||nextItem(S.ty.cur&&S.ty.cur.id);S.ty.hint=S.level===1;S.ty.res=null;S.ty.val="";}

/* ================= TRÒ CHƠI (HỌC SINH) ================= */
const NO=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TE=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function nw(n){
  if(n<20)return NO[n];
  if(n<100)return TE[Math.floor(n/10)]+(n%10?"-"+NO[n%10]:"");
  if(n<1000)return NO[Math.floor(n/100)]+" hundred"+(n%100?" and "+nw(n%100):"");
  return nw(Math.floor(n/1000))+" thousand"+(n%1000?(n%1000<100?" and ":" ")+nw(n%1000):"");
}
function decw(x){const s=String(x).split(".");return nw(+s[0])+(s[1]?" point "+s[1].split("").map(d=>NO[+d]).join(" "):"");}
function numOpts(ans,dec,unit){
  const st=dec?0.1:1;const fix=v=>+v.toFixed(dec?1:0);
  const cand=shuffle([1,-1,2,-2,3,-3,10,-10,5].map(d=>fix(ans+d*st)).filter(v=>v>=0&&v!==ans));
  const ds=[];for(const v of cand){if(ds.indexOf(v)<0)ds.push(v);if(ds.length===3)break;}
  const all=shuffle([ans].concat(ds));
  return {opts:all.map(v=>(dec?v.toFixed(1):String(v))+(unit||"")),idx:all.indexOf(ans)};
}
let _lastMathSym="";
function mathQ(L){let q=mathQ0(L),n=0;while(q.sym===_lastMathSym&&n++<8)q=mathQ0(L);_lastMathSym=q.sym;return q;}
function mathQ0(L){
  const g=S.grade||ri(1,5);let sym,en,vi,ans,dec=false,unit="";
  if(g===1){
    if(Math.random()<.5){const a=ri(1,12),b=ri(1,20-a);ans=a+b;sym=a+" + "+b+" = ?";en="What is "+nw(a)+" plus "+nw(b)+"?";vi=a+" cộng "+b+" bằng mấy?";}
    else{const a=ri(5,20),b=ri(1,a);ans=a-b;sym=a+" − "+b+" = ?";en="What is "+nw(a)+" minus "+nw(b)+"?";vi=a+" trừ "+b+" bằng mấy?";}
  }else if(g===2){
    if(Math.random()<.5){const a=pick([2,3,4,5,10]),b=ri(1,10);ans=a*b;sym=a+" × "+b+" = ?";en="What is "+nw(a)+" times "+nw(b)+"?";vi=a+" nhân "+b+" bằng mấy?";}
    else{const a=ri(10,60),b=ri(10,39);ans=a+b;sym=a+" + "+b+" = ?";en="What is the sum of "+nw(a)+" and "+nw(b)+"?";vi="Tổng của "+a+" và "+b+" là bao nhiêu?";}
  }else if(g===3){
    const k=ri(0,3),b=ri(2,9),q=ri(2,9),r=ri(1,b-1);
    if(k===0){const a=b*q;ans=q;sym=a+" : "+b+" = ?";en="What is "+nw(a)+" divided by "+nw(b)+"?";vi=a+" chia "+b+" bằng mấy?";}
    else if(k===1){const a=b*q+r;ans=r;sym=a+" : "+b+" = "+q+" (dư ?)";en="Divide "+nw(a)+" by "+nw(b)+". The quotient is "+nw(q)+". What is the remainder?";vi=a+" chia "+b+" được "+q+". Số dư là bao nhiêu?";}
    else if(k===2){const x=ri(2,9),y=ri(2,9);ans=x*y;sym=x+" × "+y+" = ?";en="What is "+nw(x)+" times "+nw(y)+"?";vi=x+" nhân "+y+" bằng mấy?";}
    else{const x=ri(100,600),y=ri(100,350);ans=x+y;sym=x+" + "+y+" = ?";en="What is "+nw(x)+" plus "+nw(y)+"?";vi=x+" cộng "+y+" bằng mấy?";}
  }else if(g===4){
    const k=ri(0,2);
    if(k===0){const n=4*ri(2,12);ans=n/4;sym="1/4 của "+n+" = ?";en="What is a quarter of "+nw(n)+"?";vi="Một phần tư của "+n+" là bao nhiêu?";}
    else if(k===1){const n=ri(101,999);ans=Math.round(n/10)*10;sym="làm tròn "+n+" → ?";en="Round "+nw(n)+" to the nearest ten.";vi="Làm tròn "+n+" đến hàng chục gần nhất.";}
    else{const l=ri(4,12),w=ri(2,l-1);ans=2*(l+w);unit=" cm";sym="P = ("+l+" + "+w+") × 2 = ?";en="A rectangle is "+nw(l)+" centimetres long and "+nw(w)+" centimetres wide. What is the perimeter?";vi="Hình chữ nhật dài "+l+" cm, rộng "+w+" cm. Chu vi là bao nhiêu?";}
  }else{
    if(Math.random()<.5){const p=pick([10,25,50]),n=pick([40,80,120,200]);ans=n*p/100;sym=p+"% của "+n+" = ?";en="What is "+nw(p)+" percent of "+nw(n)+"?";vi=p+"% của "+n+" là bao nhiêu?";}
    else{const a=ri(1,9),b=ri(1,9);ans=(a+b)/10;dec=true;sym=(a/10).toFixed(1)+" + "+(b/10).toFixed(1)+" = ?";en="What is "+decw(a/10)+" plus "+decw(b/10)+"?";vi=(a/10).toFixed(1).replace(".",",")+" cộng "+(b/10).toFixed(1).replace(".",",")+" bằng mấy?";}
  }
  const o=numOpts(ans,dec,unit);
  return {kind:"m",sym:sym,en:en,vi:vi,opts:o.opts,idx:o.idx,say:en,ans:(dec?ans.toFixed(1):String(ans))+unit,audio:L===3&&hasTTS()};
}
function vocabQ(i,terms,rds,L){
  if(i%4===3&&picPool(true).length>=4){const pq=picQ(i,L,i===3);if(pq)return pq;}
  const all=allTerms();const withEx=terms.filter(canCloze);
  const types=L===1?["e2v","v2e","rd"]:(L===2?["v2e","cz","rd"]:["cz","rd","ls"]);
  let ty=types[i%3];
  if(ty==="rd"&&!rds.length)ty="v2e";
  if(ty==="cz"&&!withEx.length)ty="v2e";
  if(ty==="ls"&&!hasTTS())ty="v2e";
  if(ty==="rd"){const r=pick(rds);const m=mkOptions(r,x=>x.en,rds.length>=4?rds:RD);return {kind:"v",prompt:r.sym,cls:"sym",hint:T("Chọn cách đọc đúng","Pick the correct reading"),opts:m.opts.map(x=>x.en),idx:m.idx,say:r.en,ans:r.en};}
  if(ty==="cz"){const t=pick(withEx);const m=mkOptions(t,x=>x.en,all);return {kind:"v",prompt:maskEx(t),cls:"sent",hint:T("Chọn từ điền vào chỗ trống","Pick the word for the blank"),opts:m.opts.map(x=>x.en),idx:m.idx,say:t.en,ans:t.en};}
  if(ty==="ls"){const t=pick(terms);const m=mkOptions(t,x=>x.en,all);return {kind:"v",prompt:"",cls:"big",hint:T("Nghe và chọn từ đúng","Listen and pick the word"),opts:m.opts.map(x=>x.en),idx:m.idx,say:t.en,ans:t.en,audio:true};}
  const t=pick(terms);
  if(ty==="e2v"){const m=mkOptions(t,x=>x.vi,all);return {kind:"v",prompt:t.en,cls:"big",hint:T("Nghĩa tiếng Việt là gì?","What is the Vietnamese meaning?"),opts:m.opts.map(x=>x.vi),idx:m.idx,say:t.en,ans:t.vi};}
  const m=mkOptions(t,x=>x.en,all);return {kind:"v",prompt:t.vi,cls:"big",hint:T("Chọn từ tiếng Anh đúng","Pick the English word"),opts:m.opts.map(x=>x.en),idx:m.idx,say:t.en,ans:t.en};
}
let gTimer=null;
function stopGame(){clearInterval(gTimer);gTimer=null;bgStop();}
function speakQ(){const g=S.game;if(!g||g.state!=="play"||g.picked!==null)return;const q=g.qs[g.i];if(q&&q.audio)setTimeout(()=>say(q.say),150);}
function gStart(kind){
  const L=S.level,lim=[0,24,20,16][L];
  const qs=[];
  if(kind==="v"){const terms=pool().length?pool():allTerms();const rds=readsPool();for(let i=0;i<10;i++)qs.push(vocabQ(i,terms,rds,L));}
  else for(let i=0;i<10;i++)qs.push(mathQ(L));
  S.game={kind:kind,qs:qs,i:0,score:0,streak:0,correct:0,left:lim,lim:lim,t0:Date.now(),l5050:true,lskip:true,state:"play",picked:null,hidden:[],gain:0,peek:false};

}
function gTick(){
  stopGame();const g=S.game;g.t0=Date.now();g.left=g.lim;
  gTimer=setInterval(()=>{
    const g=S.game;if(!g||g.state!=="play"||g.picked!==null){stopGame();return;}
    g.left=Math.max(0,g.lim-(Date.now()-g.t0)/1000);
    const b=$("#gbar");if(b){b.firstElementChild.style.width=(g.left/g.lim*100)+"%";b.classList.toggle("low",g.left<6);}
    const l=$("#gleft");if(l)l.textContent=Math.ceil(g.left);

function gAnswer(i){
  const g=S.game;if(!g||g.picked!==null)return;
  stopGame();g.picked=i;const q=g.qs[g.i];
  if(i===q.idx){g.streak++;g.correct++;g.gain=100+Math.ceil(g.left)*5+Math.min(g.streak-1,5)*20;g.score+=g.gain;}
  else{g.streak=0;g.gain=0;}

}
function nextQ(){

/* ================= CỜ XÚC XẮC (BOARD GAME) ================= */
const BG_END=35,BG_COL=["#d9482b","#1f6fc0","#14803f","#8a3fc6"],BG_NAME=["Đỏ","Xanh dương","Xanh lá","Tím"],BG_NAME_EN=["Red","Blue","Green","Purple"];
let bgTimer=null;
function bgStop(){clearTimeout(bgTimer);bgTimer=null;S.bg=null;}
function bgCell(i){const r=Math.floor(i/6),c=i%6;return {x:(r%2?5-c:c)*60,y:r*60};}
function bgLayout(){
  const sp={},ks=["ahead","back","miss","again","ahead","back","miss","again"];
  const cand=shuffle(Array.from({length:30},(_,i)=>i+3));const used=[];
  for(const c of cand){if(used.length>=ks.length)break;if(used.every(u=>Math.abs(u-c)>1)){sp[c]=ks[used.length];used.push(c);}}
  return sp;
}
function bgTok(k,x,y,r){
  const f=BG_COL[k];const a='fill="'+f+'" stroke="#fff" stroke-width="1.6"';
  if(k===0)return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" '+a+'/>';
  if(k===1)return '<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" rx="2" '+a+'/>';
  if(k===2)return '<polygon points="'+x+','+(y-r-1)+' '+(x+r+1)+','+(y+r)+' '+(x-r-1)+','+(y+r)+'" '+a+'/>';
  return '<polygon points="'+x+','+(y-r-1)+' '+(x+r+1)+','+y+' '+x+','+(y+r+1)+' '+(x-r-1)+','+y+'" '+a+'/>';
}
function bgDie(v,sz){
  const P={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]}[v]||[];
  return '<svg class="bgdie" viewBox="0 0 60 60" width="'+sz+'" height="'+sz+'" aria-label="'+v+'"><rect x="3" y="3" width="54" height="54" rx="12" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/>'+P.map(p=>'<circle cx="'+(16+p[0]*14)+'" cy="'+(16+p[1]*14)+'" r="5" fill="var(--ink)"/>').join("")+'</svg>';
}
const BG_SP={ahead:["Move ahead 2","Tiến 2 ô"],back:["Go back 3","Lùi 3 ô"],miss:["Miss a turn","Mất một lượt"],again:["Roll again","Tung lại"]};
const BG_R=50,BG_S=407,BG_X0=112,BG_Y0=100,BG_D=60;
function bgXY(i){
  let s=i*BG_D,row=0;
  for(;;){
    if(s<=BG_S||row===3){const x=row%2===0?BG_X0+s:BG_X0+BG_S-s;return {x:x,y:BG_Y0+row*100,a:row%2?180:0};}
    s-=BG_S;
    if(s<=Math.PI*BG_R){const t=s/BG_R,cx=row%2===0?BG_X0+BG_S:BG_X0,cy=BG_Y0+row*100+BG_R,sg=row%2===0?1:-1;return {x:cx+sg*BG_R*Math.sin(t),y:cy-BG_R*Math.cos(t),a:(row%2?180:0)+t*180/Math.PI};}
    s-=Math.PI*BG_R;row++;
  }
}
function bgIcon(sp){
  const st='fill="none" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"';
  if(sp==="ahead")return '<path d="M16,40 L28,28 L16,16 M30,40 L42,28 L30,16" '+st+'/>';
  if(sp==="back")return '<path d="M44,40 L32,28 L44,16 M30,40 L18,28 L30,16" '+st+'/>';
  if(sp==="miss")return '<rect x="19" y="15" width="8" height="26" rx="3" fill="var(--ink)"/><rect x="33" y="15" width="8" height="26" rx="3" fill="var(--ink)"/>';
  return '<rect x="14" y="14" width="30" height="30" rx="7" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/><circle cx="22" cy="22" r="3" fill="var(--ink)"/><circle cx="36" cy="36" r="3" fill="var(--ink)"/><circle cx="29" cy="29" r="3" fill="var(--ink)"/>';
}

   +'<g transform="translate('+(W-56)+','+(H-48)+')"><path d="M0,-26 C-22,-26 -24,2 -10,12 L-10,22 L10,22 L10,12 C24,2 22,-26 0,-26Z" fill="var(--hi)" stroke="var(--ink)" stroke-width="2.5"/><path d="M-8,28 H8" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>'
   +'<g transform="translate(56,'+(H-44)+')"><polygon points="0,-20 6,-6 21,-6 9,3 14,18 0,9 -14,18 -9,3 -21,-6 -6,-6" fill="#ff9f43" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/></g>'
   +'<g transform="translate('+(W-70)+','+(BG_Y0+150)+')"><rect x="-20" y="-16" width="40" height="32" rx="4" fill="#7db1ff" stroke="var(--ink)" stroke-width="2.5"/><path d="M0,-16 V16" stroke="var(--ink)" stroke-width="2.5"/></g>';
  const road="M"+BG_X0+","+BG_Y0+" H"+(BG_X0+BG_S)+" A"+BG_R+","+BG_R+" 0 0 1 "+(BG_X0+BG_S)+","+(BG_Y0+100)+" H"+BG_X0+" A"+BG_R+","+BG_R+" 0 0 0 "+BG_X0+","+(BG_Y0+200)+" H"+(BG_X0+BG_S)+" A"+BG_R+","+BG_R+" 0 0 1 "+(BG_X0+BG_S)+","+(BG_Y0+300)+" H"+BG_X0;

    else if(sp==="again")fill="color-mix(in srgb, var(--hi) 75%, var(--card))";
    o+='<g transform="translate('+c.x.toFixed(1)+','+c.y.toFixed(1)+')"><rect x="-26" y="-26" width="52" height="52" rx="10" fill="'+fill+'" stroke="var(--ink)" stroke-width="2.4" />';

    o+='</g>';
  }
  [0,BG_END].forEach(i=>{const c=bgXY(i);o+='<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="34" fill="'+(i?"var(--hi)":"var(--card)")+'" stroke="var(--ink)" stroke-width="3.2"/><text x="'+c.x.toFixed(1)+'" y="'+(c.y-10).toFixed(1)+'" class="bgtx big" style="font-size:14px">'+(i?"FINISH":"START")+'</text>';});
  const at={};b.pos.forEach((p,k)=>{(at[p]=at[p]||[]).push(k);});
  Object.keys(at).forEach(p=>{const c=bgXY(+p),n=at[p].length,sp=(+p===0||+p===BG_END);at[p].forEach((k,j)=>{
    const base=sp?[0,14]:[0,9],off=n===1?[0,0]:[[-10,-6],[10,-6],[-10,10],[10,10]][j];
    o+='<g class="bgtk'+(k===b.turn&&b.state!=="end"?" act":"")+'">'+bgTok(k,+(c.x+base[0]*(n===1?1:0)+off[0]).toFixed(1),+(c.y+(n===1?base[1]:(sp?base[1]-2:4))+off[1]).toFixed(1),n===1?11:8)+'</g>';});});
  return o+'</svg>';
}
function bgQ(b){
  const L=S.level;let q=null;
  for(let t=0;t<8;t++){
    const useM=b.mode==="m"||(b.mode==="mix"&&Math.random()<.45);
    if(useM)q=mathQ(L);else{const terms=pool().length?pool():allTerms();q=vocabQ(b.cnt++,terms,readsPool(),L);}
    const key=q.sym||q.prompt||q.say||q.en;if(!b.seen[key]||t===7){b.seen[key]=1;break;}
  }
  return q;
}
function bgNext(b){
  let n=0;do{b.turn=(b.turn+1)%b.n;n++;if(b.skip[b.turn]){b.skip[b.turn]=false;b.note=b.turn;continue;}break;}while(n<8);
  b.state="roll";b.q=null;b.picked=null;
}
function bgMove(b,to,after){
  clearTimeout(bgTimer);const k=b.turn;
  const stepf=()=>{
    if(!S.bg)return;
    if(b.pos[k]===to){after();render();return;}
    b.pos[k]+=b.pos[k]<to?1:-1;render();bgTimer=setTimeout(stepf,230);
  };
  stepf();
}
function bgLand(b){
  const k=b.turn,p=b.pos[k];
  if(p>=BG_END){b.state="end";b.win=k;try{beep();}catch(e){}return;}
  const sp=b.sp[p];
  if(!sp){b.q=bgQ(b);b.picked=null;b.peek=false;b.state="q";if(b.q.audio&&hasTTS())setTimeout(()=>say(b.q.say),200);return;}
  b.state="fx";b.fx=sp;
}
function bgFx(b){
  const k=b.turn,sp=b.fx;b.fx=null;
  if(sp==="again"){b.state="roll";b.msg=null;return render();}
  if(sp==="miss"){b.skip[k]=true;bgNext(b);return render();}
  const to=sp==="ahead"?Math.min(BG_END,b.pos[k]+2):Math.max(0,b.pos[k]-3);
  b.state="move";bgMove(b,to,()=>{if(b.pos[k]>=BG_END){b.state="end";b.win=k;}else bgNext(b);});
}
function bgRoll(b){
  if(b.state!=="roll")return;
  b.state="rolling";let n=0;
  const f=()=>{
    if(!S.bg)return;
    if(n++<9){b.die=ri(1,6);render();bgTimer=setTimeout(f,75);return;}
    b.die=ri(1,6);b.from=b.pos[b.turn];b.state="move";render();
    bgMove(b,Math.min(BG_END,b.from+b.die),()=>bgLand(b));
  };f();
}

    const opts=q.opts.map((o,i)=>{let c="opt";if(b.picked!==null){if(i===q.idx)c+=" right";else if(i===b.picked)c+=" wrong";}return '<button class="'+c+(q.optPic?" pic":"")+'" data-a="bpick" data-v="'+i+'"'+(b.picked!==null?" disabled":"")+'>'+(q.optPic?o:esc(o))+'</button>';}).join("");
    act='<div class="card bgact" style="align-items:stretch"><p class="bgturn" style="text-align:center">'+who+' · '+T("ô số ","square ")+b.pos[cur]+'</p><div class="prompt" style="padding:4px">'+promptHTML(q,b)+'</div></div><div class="opts'+(q.optPic?" pics":"")+'">'+opts+'</div>'
      +(b.picked===null?'':'<p class="feedback '+(b.picked===q.idx?"ok":"no")+'">'+(b.picked===q.idx?T("Chính xác! Ở lại ô này.","Correct! Stay on this square."):T("Chưa đúng. Đáp án: ","Not quite. Answer: ")+esc(q.ans)+T(". Quay về ô số ",". Go back to square ")+b.from)+'</p><div class="btns"><button class="btn pri" data-a="bnext">'+T("Lượt tiếp theo","Next turn")+'</button></div>');
  }
  return '<div class="bgwrap '+b.state+'">'+board+'<div class="bgside">'+players+act+(b.state==="end"?'':quit)+'</div></div>';
}
