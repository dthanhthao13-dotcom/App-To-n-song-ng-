/* ================= TRÌNH CHIẾU ================= */
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function openPres(title,ids){
  if(!ids.length)return;
  S.pres={title:title,ids:ids,i:0,rev:false,hideVi:false};render();
}
function presHTML(){
  const p=S.pres;if(!p)return "";

   +'<div class="pres-main" id="pmain" data-a="presrev">'+(f.kind==="t"?ilFor(f.t.en):'')+'<div class="big '+((f.kind==="p"||f.kind==="s")?"ph":"")+'" style="'+(f.kind==="r"?"font-family:var(--f-i)":"")+'">'+fbk(f.main)+'</div>'
   +(f.kind==="t"&&f.sub?'<div class="bi">'+esc(f.sub)+'</div>':'')+(f.kind==="s"&&f.sub?'<div class="bi" style="font-size:clamp(1.1rem,4.5vw,1.6rem)">'+esc(f.sub)+'</div>':'')+(f.kind==="r"&&f.sub?'<div class="bv" style="color:var(--on-board);font-size:clamp(1.3rem,5vw,2rem);font-weight:600">'+fbk(f.sub)+'</div>':'')
   +(f.vi&&!p.hideVi?'<div class="bv">'+esc(f.vi)+'</div>':'')
   +(f.can?'<div class="tapn">'+(p.rev?T("Chạm để ẩn đáp án","Tap to hide the answer"):T("Chạm để xem đáp án","Tap to show the answer"))+'</div>':'')+'</div>'
   +'<div class="pres-ctl"><button class="btn" data-a="presprev" aria-label="'+T("Câu trước","Previous")+'">'+ic("left")+'</button><button class="btn" data-a="say" data-t="'+esc(f.say)+'" aria-label="'+T("Nghe","Listen")+'">'+ic("speaker")+'</button><button class="btn pri" data-a="presnext" aria-label="'+T("Câu sau","Next")+'">'+T("Tiếp","Next")+' '+ic("right")+'</button></div>'
   +'<div class="pres-bot"><button class="btn" data-a="presvi">'+(p.hideVi?T("Hiện tiếng Việt","Show Vietnamese"):T("Ẩn tiếng Việt","Hide Vietnamese"))+'</button><button class="btn" data-a="presfs" aria-label="'+T("Toàn màn hình","Fullscreen")+'">'+ic("expand")+'</button>'
   +'<span class="t'+(t.left===0?" done":"")+'" id="tmText">'+fmt(t.left)+'</span><button class="btn" data-a="tmtoggle" aria-label="'+(t.run?T("Tạm dừng","Pause"):T("Bắt đầu","Start"))+'">'+ic(t.run?"pause":"play")+'</button><button class="btn" data-a="tmreset" aria-label="'+T("Đặt lại","Reset")+'">'+ic("reset")+'</button></div>'
   +'<div class="tmset">'+[1,3,5,10].map(m=>'<button class="btn mini" data-a="tmset" data-v="'+m*60+'" aria-pressed="'+(t.total===m*60?"true":"false")+'">'+m+' '+T("phút","min")+'</button>').join("")+'</div></div>';
}
let tmI=null;
function tmUpdate(){const t=S.timer;const a=$("#tmText");if(a){a.textContent=fmt(t.left);a.classList.toggle("done",t.left===0);}}
function tmTick(){const t=S.timer;if(!t.run)return;t.left=Math.max(0,Math.ceil((t.end-Date.now())/1000));tmUpdate();if(t.left<=0){t.run=false;clearInterval(tmI);beep();render();}}
function presMove(d){const p=S.pres;if(!p)return;p.i=(p.i+d+p.ids.length)%p.ids.length;p.rev=false;render();}

/* ================= RENDER ================= */
function viewHTML(){
  switch(S.view){
    case "look":return look();case "inter":return inter();case "prac":return prac();
    case "lessons":return lessonsView();case "play":return playView();case "mine":return mine();
    default:return home();
  }
}
function render(){
  document.documentElement.lang=S.lang==="vi"?"vi":"en";
  document.documentElement.setAttribute("data-role",S.role);
  const showCtx=!["home","mine"].includes(S.view);const bgWide=S.view==="play"&&S.bg&&S.bg.state!=="setup";
  $("#app").innerHTML=topbar()+'<div class="shell'+(bgWide?" wide":"")+'">'+(showCtx&&!bgWide?ctxBar():'')+'<main id="main">'+viewHTML()+'</main></div>'+tabbar()+drawer()+presHTML()+spHTML();
  try{document.body.style.overflow=(S.pres||S.drawer||S.sp)?"hidden":"";}catch(e){}
  if(S.view==="prac"&&S.pmode==="type"&&S.ty.cur&&!S.ty.res){const el=$("#tyin");if(el)el.focus();}
}
function go(v){
  if(S.view==="play"&&v!=="play")stopGame();
  spAbort();S.sp=null;S.view=v;S.drawer=false;S.rev={};S.pres=null;
  if(v==="prac")initPrac();
  if(v==="lessons"&&S.role!=="teacher"){S.view=v="play";}
  if(v==="play"&&S.role!=="student"){S.view=v="lessons";}
  if(v==="play"&&S.game&&S.game.state==="play"){stopGame();S.game=null;}
  if(["look","inter","prac","lessons","play"].indexOf(S.view)>=0){S.last={v:S.view};store.set("last",S.last);}
  if(S.view==="lessons"&&S.lesson)touchDay();
  render();window.scrollTo(0,0);
}
function applyTheme(){try{if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}catch(e){}}
function resetForLevel(){S.rev={};S.qz.cur=null;S.ty.cur=null;if(S.game){stopGame();S.game=null;}}

  bquit:()=>{bgStop();render();},
  g5050:()=>{const g=S.game;if(!g.l5050||g.picked!==null)return;g.l5050=false;const q=g.qs[g.i];g.hidden=shuffle(q.opts.map((o,i)=>i).filter(i=>i!==q.idx)).slice(0,2);render();},
  gskip:()=>{const g=S.game;if(!g.lskip||g.picked!==null)return;g.lskip=false;nextQ();},
  gnext:()=>nextQ(),
  gquit:()=>{stopGame();S.game=null;render();},
  /* kho */
  mtab:v=>{S.mine=v;render();},
  mdel:v=>{S.custom=S.custom.filter(c=>String(c.id)!==String(v));store.set("custom",S.custom);delete S.favs["c"+v];store.set("favs",S.favs);render();},
  mreset:()=>{S.confirmReset=!S.confirmReset;render();},
  mresetgo:()=>{S.used={};S.rpbest={};store.set("used",{});store.set("rpbest",{});S.known={};S.rate={};S.best={v:0,m:0};S.taught={};S.confirmReset=false;store.set("known",{});store.set("rate",{});store.set("best2",S.best);store.set("taught",{});toast(T("Đã xóa tiến độ học.","Progress cleared."));render();}
};

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  /* chạm vào nút bên trong vùng trình chiếu không kích hoạt lật đáp án */
  if(b.id==="pmain"&&e.target.closest("button"))return;
  const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.v,b,e);}
});
document.addEventListener("input",e=>{
  if(e.target.id==="iq"){S.iq=e.target.value;const b=$("#ibody");if(b)b.innerHTML=itBody();document.querySelectorAll('[data-a="idir"]').forEach(x=>x.setAttribute("aria-pressed",(!S.iq.trim()&&x.dataset.v===S.it.dir)?"true":"false"));return;}
  if(e.target.id==="nq"){S.nq=e.target.value;const o=$("#nout");if(o)o.innerHTML=nOut();return;}
  if(e.target.id==="dq"){S.q=e.target.value;const l=$("#list");if(l)l.innerHTML=dictList();const c=$("#dcount");if(c)c.textContent=filterTerms().length+" "+T("thuật ngữ","terms");}
});
document.addEventListener("change",e=>{
  if(e.target.id==="nm"){S.name=e.target.value.trim();store.set("name",S.name);if(!S.onb){S.onb=true;store.set("onb",true);}render();}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="addterm"){
    const en=$("#cen").value.trim(),vi=$("#cvi").value.trim();if(!en||!vi)return;
    S.custom.push({id:Date.now(),en:en,vi:vi,ex:$("#cex").value.trim(),g:+$("#cg").value});store.set("custom",S.custom);
    toast(T("Đã thêm từ mới.","Term added."));render();
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="tyin"&&!S.ty.res){e.preventDefault();ACT.tycheck();return;}
  if(S.pres){
    if(e.key==="ArrowRight")presMove(1);else if(e.key==="ArrowLeft")presMove(-1);else if(e.key==="Escape")ACT.presclose();
    return;
  }
  if(e.key==="Escape"&&S.sp){spClose();return;}
  if(e.key==="Escape"&&S.drawer){S.drawer=false;render();}
});
let sx=null,sy=null;
document.addEventListener("touchstart",e=>{if(e.target.closest("#pmain")){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else sx=null;},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){presMove(dx<0?1:-1);e.preventDefault();}
},{passive:false});

applyTheme();
initPrac();
render();
})();
</script>
</body></html>
